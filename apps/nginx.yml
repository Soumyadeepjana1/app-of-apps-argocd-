apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-child              # Child app name
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Soumyadeepjana1/online-shop-demo-gitops-.git # Repo containing child apps(that you have forked and cloned earlier)
    targetRevision: master
    path: ui_approach/nginx      # path of Nginx app in `argocd-demos` repo
  destination:
    server: https://192.168.49.2:8443 # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default           # Deploys into default namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

