apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: apache
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Soumyadeepjana1/app-of-apps-argocd-.git
    targetRevision: master
    path: apps/workloads/apache

  destination:
    server: https://kubernetes.default.svc
    namespace: apache

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
